<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Kayıt Sistemi</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #2d3436;
            --danger: #ff7675;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 350px;
            text-align: center;
        }

        h2 { margin-bottom: 20px; color: var(--secondary); }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
        }

        input::placeholder { color: #ddd; }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--secondary); }

        .warning {
            font-size: 12px;
            color: var(--danger);
            margin: 10px 0;
        }

        /* Admin Küçük Kare */
        #admin-trigger {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 15px;
            height: 15px;
            background: red;
            cursor: pointer;
            opacity: 0.5;
        }

        /* Admin Paneli */
        #admin-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e272e;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            z-index: 100;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        .btn-action { padding: 5px 10px; cursor: pointer; border: none; border-radius: 4px; }
        .ban { background: #d63031; color: white; }
    </style>
</head>
<body>

    <div class="container" id="reg-form">
        <h2>Kayıt Ol</h2>
        <p class="warning">⚠️ UYARI: Gerçek bilgilerinizi yazmayın!</p>
        <p style="font-size: 11px;">Kriterler: @, #, ₺, _, 1, 2, 3...</p>
        
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="register()">Kayıt Ol</button>
    </div>

    <div id="admin-panel">
        <h3>Admin Kontrol Paneli</h3>
        <table>
            <thead>
                <tr>
                    <th>Nick</th>
                    <th>Şifre</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>
        <br>
        <button onclick="closeAdmin()">Kapat</button>
    </div>

    <div id="admin-trigger" onclick="openAdminPrompt()"></div>

    <script src="script.js"></script>
</body>
</html>
