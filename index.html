<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Kayıt ve Admin Sistemi</title>
    <style>
        /* ŞIK VE RENKLİ CSS TASARIMI */
        :root {
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --primary: #8b5cf6;
            --accent: #ec4899;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
        }

        h2 { margin-top: 0; color: var(--primary); font-size: 1.5rem; }

        .warning-text {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }

        /* ADMIN TETİKLEYİCİ KARE */
        #admin-trigger {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 12px;
            height: 12px;
            background: var(--danger);
            cursor: pointer;
            border-radius: 2px;
            opacity: 0.3;
        }

        /* ADMIN PANELİ MODAL */
        #admin-panel {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .admin-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        
        .action-btn {
            background: var(--danger);
            padding: 5px 10px;
            font-size: 0.7rem;
            width: auto;
            margin: 0;
        }

        .close-admin {
            background: #475569;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ortam Kayıt</h2>
        <p class="warning-text">Gerçek bilgilerinizi yazmayınız.<br>Kriter: @ # ₺ _ 123</p>
        
        <input type="text" id="nick" placeholder="Nickinizi yazın">
        <input type="password" id="pass" placeholder="Şifrenizi yazın">
        <button onclick="saveUser()">Kaydol</button>
    </div>

    <div id="admin-panel">
        <div class="admin-content">
            <h3>Admin Paneli - Kullanıcı Listesi</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nick</th>
                        <th>Şifre</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="user-list"></tbody>
            </table>
            <button class="close-admin" onclick="toggleAdmin(false)">Paneli Kapat</button>
        </div>
    </div>

    <div id="admin-trigger" onclick="checkAdmin()"></div>

    <script>
        // JAVASCRIPT KODLARI
        
        // Verileri tarayıcı hafızasından al
        let users = JSON.parse(localStorage.getItem('app_users')) || [];

        function saveUser() {
            const nickInput = document.getElementById('nick');
            const passInput = document.getElementById('pass');
            
            // Basit Kriter Kontrolü
            const pattern = /[@#₺_123]/;
            
            if(nickInput.value === "" || passInput.value === "") return;
            
            if(!pattern.test(passInput.value)) {
                console.log("Kriter hatası"); // Ekrana bir şey yansıtmıyoruz
                return;
            }

            // Kaydet
            const user = { n: nickInput.value, p: passInput.value };
            users.push(user);
            localStorage.setItem('app_users', JSON.stringify(users));

            // Sadece kutuları temizle (Ekrana yazı çıkarmaz)
            nickInput.value = "";
            passInput.value = "";
        }

        function checkAdmin() {
            const code = prompt("Admin Girişi:");
            if (code === "bbonwerson") {
                toggleAdmin(true);
                renderUsers();
            }
        }

        function toggleAdmin(show) {
            const panel = document.getElementById('admin-panel');
            panel.style.display = show ? 'flex' : 'none';
        }

        function renderUsers() {
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            
            users.forEach((u, index) => {
                const row = `
                    <tr>
                        <td>${u.n}</td>
                        <td>${u.p}</td>
                        <td><button class="action-btn" onclick="deleteUser(${index})">Ban/Mute</button></td>
                    </tr>
                `;
                list.innerHTML += row;
            });
        }

        function deleteUser(index) {
            users.splice(index, 1);
            localStorage.setItem('app_users', JSON.stringify(users));
            renderUsers(); // Tabloyu güncelle
        }
    </script>
</body>
</html>
